<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Character</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
        width: 100%;
        overflow: hidden;
        background: transparent;
        touch-action: pan-y;
        overscroll-behavior: none;
      }
      a-scene {
        display: block;
        touch-action: pan-y;
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh !important;
        width: 100vw !important;
        background: transparent;
      }
      a-scene canvas {
        display: block;
        touch-action: pan-y !important;
        height: 100% !important;
        width: 100% !important;
      }
      #scrollSpacer {
        height: 100vh;
        pointer-events: none;
        visibility: hidden;
        width: 1px;
      }
      .a-enter-vr,
      .a-enter-ar,
      .a-orientation-modal {
        display: none !important;
      }
    </style>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      /*
       * Showcase tuning — edit these to adjust the object directory scene.
       * 7 columns, proportionally scaled below referenceViewportWidth.
       *
       * Grid placement: layoutGrid() sets each cell at
       *   x = (column - 3) * layout.xStep,  y = layout.topY - row * layout.rowStep.
       * Inside a cell, each model’s vertical offset uses objectY[key] (negative = lower in frame).
       * Hover: objectHover[key] is cell scale on hover (1 = none, 1.4 = 40% larger).
       * Spin: showcaseSpinSpeed sets rotation rate for all objects.
       * Facing on load: objectRotation[key] — x/y/z degrees (y also used as spin start angle).
       */
      var SHOWCASE_CONFIG = {
        hoverScaleAmount: 1.4,
        hoverScaleDuration: 360,
        /* Fallback hover formula when objectHover[key] is omitted (see hoverAmountFor). */
        hoverReferenceScale: 1.25,
        columns: 7,
        referenceViewportWidth: 1500,
        baseGridScale: 1.2,
        layout: {
          xStep: 2.95,
          rowStep: 3.14,
          topY: 4.18,
          pxPerRow: 360,
          visibleRows: 2
        },
        cell: {
          hitWidth: 2.65,
          hitHeight: 3.28
        },
        camera: { position: "0 0.88 3.45" },
        /* Degrees per second — same spin rate for every showcase object. */
        showcaseSpinSpeed: 6.3,
        objectSize: {
          character: 3.35,
          balloon: 1.04,
          giraffe: 0.97,
          fish: 1,
          house: 1.2,
          chicken: 1.8,
          cow: 1.13,
          butterfly: 0.78,
          bird: 0.99,
          helicopter: 1.5,
          tree: 1.05,
          flower: 1,
          floatie: 1,
          sun: 0.4,
          sign: 0.77,
          flame: 1,
          chair: 1,
          umbrella: 0.76,
          fishingRod: 1.15,
          beachBall: 0.97
        },
        /* Vertical offset per object within its grid cell (negative = lower). */
        objectY: {
          character: -1.02,
          balloon: -1.08,
          giraffe: -1.08,
          fish: -0.45,
          house: -0.94,
          chicken: -0.9,
          cow: -0.86,
          butterfly: -0.46,
          bird: -0.45,
          helicopter: -0.43,
          tree: -1.22,
          flower: -0.78,
          floatie: -0.5,
          sun: -0.45,
          sign: -0.8,
          flame: -0.85,
          chair: -0.9,
          umbrella: -1.00,
          fishingRod: -0.62,
          beachBall: -0.35
        },
        /* Starting rotation per object (degrees). y = load facing + showcase-spin start. */
        objectRotation: {
          character: { x: 0, y: 180, z: 0 },
          balloon: { x: 0, y: 0, z: 0 },
          giraffe: { x: 0, y: 155, z: 0 },
          fish: { x: 0, y: -45, z: 0 },
          house: { x: 0, y: 176, z: 0 },
          chicken: { x: 0, y: -35, z: 0 },
          cow: { x: 0, y: -25, z: 0 },
          butterfly: { x: 0, y: 0, z: 0 },
          bird: { x: 0, y: 145, z: 0 },
          helicopter: { x: -14, y: 150, z: 0 },
          tree: { x: 0, y: 0, z: 0 },
          flower: { x: 42, y: 24, z: 14 },
          floatie: { x: 65, y: 0, z: 0 },
          sun: { x: 0, y: 0, z: 0 },
          sign: { x: 0, y: 32, z: 0 },
          flame: { x: 0, y: 0, z: 0 },
          chair: { x: 0, y: 180, z: 0 },
          umbrella: { x: -3, y: 0, z: 0 },
          fishingRod: { x: 0, y: -22, z: -8 },
          beachBall: { x: 90, y: 0, z: 8 }
        },
        /* Per-object hover cell scale (1 = no growth; higher = bigger pop on hover). */
        objectHover: {
          character: 1.4,
          balloon: 1.70,
          giraffe: 1.35,
          fish: 1.36,
          house: 1.48,
          chicken: 1.32,
          cow: 1.45,
          butterfly: 1.29,
          bird: 1.43,
          helicopter: 1.49,
          tree: 1.52,
          flower: 1.27,
          floatie: 1.42,
          sun: 1.95,
          sign: 1.61,
          flame: 1.37,
          chair: 1.48,
          umbrella: 1.52,
          fishingRod: 1.7,
          beachBall: 1.55
        }
      };

      var SHOWCASE_POINTER_ACTIVE = false;
      window.addEventListener("mousemove", function () {
        SHOWCASE_POINTER_ACTIVE = true;
      });

      AFRAME.registerComponent("showcase-spin", {
        schema: {
          speed: { type: "number", default: 10 },
          baseY: { type: "number", default: 0 }
        },
        init: function () {
          this.t = 0;
          this.baseRot = this.el.getAttribute("rotation") || { x: 0, y: 0, z: 0 };
        },
        tick: function (_, dt) {
          this.t += (dt || 16) / 1000;
          var y = this.data.baseY + this.t * this.data.speed;
          this.el.setAttribute(
            "rotation",
            this.baseRot.x + " " + y + " " + this.baseRot.z
          );
        }
      });

      AFRAME.registerComponent("showcase-head-look", {
        schema: {
          phaseOffset: { type: "number", default: 0 }
        },
        init: function () {
          this.angle = this.data.phaseOffset + Math.random() * 6.28;
          this.holdRem = 0;
          this.holdYaw = 0;
          this.holdPitch = 0;
          this.nextHoldCheck = 1.4 + Math.random() * 2.2;
        },
        tick: function (_, deltaMs) {
          var dt = Math.min((deltaMs || 16) / 1000, 0.05);
          var head = this.el.querySelector(".human-head");
          if (!head) return;
          if (this.holdRem > 0) {
            this.holdRem -= dt;
            head.setAttribute("rotation", this.holdPitch + " " + this.holdYaw + " 0");
            return;
          }
          this.angle += dt * 0.48;
          this.nextHoldCheck -= dt;
          if (this.nextHoldCheck <= 0) {
            this.nextHoldCheck = 2.8 + Math.random() * 4.6;
            var yaw =
              Math.sin(this.angle * 0.88) * 42 +
              Math.sin(this.angle * 1.63 + this.data.phaseOffset) * 26 +
              Math.sin(this.angle * 0.37) * 14;
            var pitch =
              Math.sin(this.angle * 0.55 + 0.6) * 10 +
              Math.sin(this.angle * 1.12 + this.data.phaseOffset) * 6 +
              Math.sin(this.angle * 0.24) * 4;
            this.holdYaw = yaw;
            this.holdPitch = pitch;
            this.holdRem = 0.85 + Math.random() * 2.15;
            head.setAttribute("rotation", this.holdPitch + " " + this.holdYaw + " 0");
            return;
          }
          var headYaw =
            Math.sin(this.angle * 0.88) * 42 +
            Math.sin(this.angle * 1.63 + this.data.phaseOffset) * 26 +
            Math.sin(this.angle * 0.37) * 14;
          var headPitch =
            Math.sin(this.angle * 0.55 + 0.6) * 10 +
            Math.sin(this.angle * 1.12 + this.data.phaseOffset) * 6 +
            Math.sin(this.angle * 0.24) * 4;
          head.setAttribute("rotation", headPitch + " " + headYaw + " 0");
        }
      });

      AFRAME.registerComponent("character-idle-gestures", {
        init: function () {
          this.t = 0;
          this.head = this.el.querySelector(".human-head");
          this.torso = this.el.querySelector(".human-torso");
          this.leftArm = this.el.querySelector(".human-arm-left");
          this.rightArm = this.el.querySelector(".human-arm-right");
          this.leftLeg = this.el.querySelector(".human-leg-left");
          this.rightLeg = this.el.querySelector(".human-leg-right");
          var basePos = this.el.getAttribute("position") || { x: 0, y: 0, z: 0 };
          this.baseX = Number(basePos.x) || 0;
          this.baseY = Number(basePos.y) || 0;
          this.baseZ = Number(basePos.z) || 0;
          this.moveFromX = this.baseX;
          this.moveToX = this.baseX;
          this.moveElapsed = 0;
          this.moveDuration = 1;
          this.pauseRemaining = 3.2 + Math.random() * 3.6;
          this.walking = false;
          this.stepPhase = 0;
          this.stepRate = 5.1;
          this.walkStrength = 0;
          this.bodyYaw = 0;
          this.targetBodyYaw = 0;
          this.headYaw = 0;
          this.headPitch = -1;
          this.targetYaw = 0;
          this.targetPitch = -1;
          this.nextLook = 1.8 + Math.random() * 2.8;
        },
        tick: function (_, deltaMs) {
          var dt = Math.min((deltaMs || 16) / 1000, 0.05);
          this.t += dt;
          var t = this.t;
          var breathe = Math.sin(t * 1.25);
          this.walkStrength = 0;
          if (this.walking) {
            this.moveElapsed += dt;
            var p = Math.min(1, this.moveElapsed / this.moveDuration);
            var eased = p * p * (3 - 2 * p);
            var walkX = this.moveFromX + (this.moveToX - this.moveFromX) * eased;
            var direction = this.moveToX >= this.moveFromX ? 1 : -1;
            this.walkStrength = Math.sin(p * Math.PI);
            this.stepPhase += dt * this.stepRate;
            if (p >= 1) {
              walkX = this.moveToX;
              this.moveFromX = walkX;
              this.walking = false;
              this.targetBodyYaw = 0;
              this.pauseRemaining = 4.5 + Math.random() * 7.0;
            }
            var step = Math.sin(this.stepPhase);
            var walkBob = this.walkStrength * (0.006 + Math.abs(step) * 0.008);
            var lean = this.walkStrength * direction * 0.75;
            this.bodyYaw += (this.targetBodyYaw - this.bodyYaw) * (1 - Math.exp(-2.45 * dt));
            this.el.object3D.position.set(walkX, this.baseY + walkBob, this.baseZ);
            this.el.object3D.rotation.set(
              0,
              Math.PI + THREE.MathUtils.degToRad(this.bodyYaw),
              THREE.MathUtils.degToRad(-lean)
            );
          } else {
            this.pauseRemaining -= dt;
            if (this.pauseRemaining <= 0) {
              if (Math.random() < 0.42) {
                this.pauseRemaining = 2.2 + Math.random() * 5.6;
                this.targetBodyYaw = 0;
              } else {
              this.moveFromX = this.el.object3D.position.x;
              var nearCenter = Math.abs(this.moveFromX - this.baseX) < 0.035;
              this.moveToX = nearCenter
                ? this.baseX + (Math.random() < 0.5 ? -1 : 1) * (0.11 + Math.random() * 0.17)
                : this.baseX + (-0.028 + Math.random() * 0.056);
              var moveDir = this.moveToX >= this.moveFromX ? 1 : -1;
              this.moveElapsed = 0;
              this.moveDuration = 2.25 + Math.random() * 1.7;
              this.stepRate = 3.15 + Math.random() * 1.0;
              this.targetBodyYaw = moveDir * (10 + Math.random() * 4);
              this.walking = true;
              }
            }
            this.bodyYaw += (this.targetBodyYaw - this.bodyYaw) * (1 - Math.exp(-1.8 * dt));
            this.el.object3D.position.set(this.moveFromX, this.baseY, this.baseZ);
            this.el.object3D.rotation.set(0, Math.PI + THREE.MathUtils.degToRad(this.bodyYaw), 0);
          }
          if (this.torso) {
            this.torso.object3D.position.set(0, 0.45 + breathe * 0.008, 0);
          }
          if (this.head) {
            this.nextLook -= dt;
            if (this.nextLook <= 0) {
              this.nextLook = 2.4 + Math.random() * 5.0;
              this.targetYaw = -14 + Math.random() * 28;
              this.targetPitch = -6 + Math.random() * 11;
            }
            var settle = 1 - Math.exp(-0.82 * dt);
            this.headYaw += (this.targetYaw - this.headYaw) * settle;
            this.headPitch += (this.targetPitch - this.headPitch) * settle;
            var microYaw = Math.sin(t * 0.38) * 0.7 + Math.sin(t * 0.19 + 1.8) * 0.45;
            var microPitch = Math.sin(t * 0.31 + 0.4) * 0.42;
            this.head.object3D.rotation.set(
              THREE.MathUtils.degToRad(this.headPitch + microPitch),
              THREE.MathUtils.degToRad(this.headYaw + microYaw),
              0
            );
          }
          if (this.leftArm) {
            var armStep = this.walking ? Math.sin(this.stepPhase + Math.PI) * this.walkStrength * 2.8 : 0;
            var leftSway = Math.sin(t * 0.82 + 0.7) * 1.25 + armStep;
            this.leftArm.object3D.rotation.set(
              THREE.MathUtils.degToRad(7),
              0,
              THREE.MathUtils.degToRad(10 + leftSway)
            );
          }
          if (this.rightArm) {
            var rightArmStep = this.walking ? Math.sin(this.stepPhase) * this.walkStrength * 2.8 : 0;
            var rightSway = Math.sin(t * 0.78 + 2.4) * 1.2 + rightArmStep;
            this.rightArm.object3D.rotation.set(
              THREE.MathUtils.degToRad(7),
              0,
              THREE.MathUtils.degToRad(-10 + rightSway)
            );
          }
          if (this.leftLeg) {
            var legStepL = this.walking ? Math.sin(this.stepPhase) * this.walkStrength * 5.2 : 0;
            this.leftLeg.object3D.rotation.set(0, 0, THREE.MathUtils.degToRad(legStepL));
          }
          if (this.rightLeg) {
            var legStepR = this.walking ? Math.sin(this.stepPhase + Math.PI) * this.walkStrength * 5.2 : 0;
            this.rightLeg.object3D.rotation.set(0, 0, THREE.MathUtils.degToRad(legStepR));
          }
        }
      });

      AFRAME.registerComponent("showcase-chicken-wings", {
        init: function () {
          this.wingL = this.el.querySelector(".chicken-wing-l");
          this.wingR = this.el.querySelector(".chicken-wing-r");
          this.wingFlutterPh = 0;
          this.wingFlutterRem = 0;
          this.wingFlutterSpan = 0.5;
          this.wingFlutterCd = 0.4 + Math.random();
          this.wingFlutterOmega = 14 + Math.random() * 5;
          this.wingFlutterWy = 0;
          this.wingFlutterRz = 0;
          this.wingFlutterRx = 0;
        },
        tick: function (_, deltaMs) {
          var dt = Math.min((deltaMs || 16) / 1000, 0.05);
          var wL = this.wingL;
          var wR = this.wingR;
          if (!wL || !wR) return;
          this.wingFlutterCd -= dt;
          if (this.wingFlutterCd <= 0 && this.wingFlutterRem <= 0) {
            this.wingFlutterRem = 0.38 + Math.random() * 0.58;
            this.wingFlutterSpan = this.wingFlutterRem;
            this.wingFlutterCd = 2.1 + Math.random() * 8.9;
          }
          var flutterBell = 0;
          var flutterSpan = this.wingFlutterSpan;
          if (flutterSpan > 1e-7 && this.wingFlutterRem > 0) {
            this.wingFlutterRem -= dt;
            if (this.wingFlutterRem < 0) this.wingFlutterRem = 0;
            var progressed = THREE.MathUtils.clamp(1 - this.wingFlutterRem / flutterSpan, 0, 1);
            flutterBell = Math.pow(Math.sin(Math.PI * progressed), 1.55);
          }
          this.wingFlutterPh += dt * this.wingFlutterOmega * flutterBell;
          var ph = this.wingFlutterPh;
          var wyBurstTar = flutterBell * Math.sin(ph) * 26;
          var rzTar = flutterBell * Math.sin(ph * 2.08) * 16;
          var rxTar = flutterBell * Math.cos(ph * 1.45) * 11;
          var smActive = flutterBell > 0.12;
          var smK = Math.min(1, dt * (smActive ? 38 : 5.5));
          this.wingFlutterWy += (wyBurstTar - this.wingFlutterWy) * smK;
          this.wingFlutterRz += (rzTar - this.wingFlutterRz) * smK;
          this.wingFlutterRx += (rxTar - this.wingFlutterRx) * smK;
          if (this.wingFlutterRem <= 0 && flutterBell < 1e-6) {
            var dec = Math.min(1, dt * 6.2);
            this.wingFlutterWy *= 1 - dec;
            this.wingFlutterRz *= 1 - dec;
            this.wingFlutterRx *= 1 - dec;
          }
          var lx = 14;
          var lyL = -34;
          var lzL = 131;
          var wy = this.wingFlutterWy;
          var rz = this.wingFlutterRz;
          var rx = this.wingFlutterRx;
          wL.setAttribute("rotation", lx + rx + " " + (lyL + wy) + " " + (lzL + rz));
          wR.setAttribute("rotation", lx + rx + " " + (-lyL - wy) + " " + (-lzL - rz));
        }
      });

      AFRAME.registerComponent("showcase-smoke-puff", {
        schema: {
          baseOpacity: { type: "number", default: 0.34 },
          delay: { type: "number", default: 0 },
          dur: { type: "number", default: 3800 }
        },
        init: function () {
          this.mesh = null;
        },
        tick: function (time) {
          if (!this.mesh) {
            this.mesh = this.el.getObject3D("mesh");
            if (!this.mesh || !this.mesh.material) return;
            this.mesh.material.transparent = true;
            this.mesh.material.depthWrite = false;
          }
          var dur = Math.max(1, this.data.dur);
          var local = ((time - this.data.delay) % dur + dur) % dur;
          var phase = local / dur;
          var envelope = Math.sin(phase * Math.PI);
          envelope = Math.pow(Math.max(0, envelope), 1.25);
          this.mesh.material.opacity = this.data.baseOpacity * envelope;
          this.mesh.material.needsUpdate = true;
        }
      });

      AFRAME.registerComponent("showcase-beach-ball", {
        init: function () {
          var radius = 0.37;
          var colors = [0x1f5fe0, 0xe53935, 0xf7f4ea, 0xe747a9, 0xf7c744, 0x39c778];
          var group = new THREE.Group();
          var i;
          for (i = 0; i < colors.length; i++) {
            var geom = new THREE.SphereGeometry(
              radius,
              18,
              28,
              (i / colors.length) * Math.PI * 2,
              Math.PI * 2 / colors.length,
              0,
              Math.PI
            );
            var mat = new THREE.MeshStandardMaterial({
              color: colors[i],
              roughness: 0.34,
              metalness: 0.02,
              fog: true
            });
            group.add(new THREE.Mesh(geom, mat));
          }
          var capMat = new THREE.MeshStandardMaterial({
            color: 0xf7f4ea,
            roughness: 0.28,
            metalness: 0.01,
            fog: true,
            side: THREE.DoubleSide
          });
          var capGeom = new THREE.CircleGeometry(radius * 0.24, 36);
          var capTop = new THREE.Mesh(capGeom, capMat);
          capTop.position.y = radius * 1.006;
          capTop.rotation.x = -Math.PI / 2;
          group.add(capTop);
          var capBottom = new THREE.Mesh(capGeom.clone(), capMat);
          capBottom.position.y = -radius * 1.006;
          capBottom.rotation.x = Math.PI / 2;
          group.add(capBottom);
          this.meshGroup = group;
          this.el.object3D.add(group);
        },
        remove: function () {
          if (!this.meshGroup) return;
          this.el.object3D.remove(this.meshGroup);
          this.meshGroup.traverse(function (node) {
            if (node.geometry) node.geometry.dispose();
            if (node.material) node.material.dispose();
          });
        }
      });

      /* Pasture cow head look + tail sway (same math as index.html globe-cow-graze, idle). */
      AFRAME.registerComponent("showcase-cow-idle", {
        init: function () {
          this.stridePhase = Math.random() * Math.PI * 2;
          this.tailT = Math.random() * 20;
          this.headCow = this.el.querySelector(".cow-head");
          this.tailCow = this.el.querySelector(".cow-tail");
        },
        tick: function (_, deltaMs) {
          var dt = Math.min((deltaMs || 16) / 1000, 0.05);
          this.stridePhase += dt * 0.94;
          if (this.headCow) {
            this.headCow.setAttribute(
              "rotation",
              Math.sin(this.stridePhase * 0.52) * 5 +
                " " +
                Math.sin(this.stridePhase * 0.38) * 7 +
                " 0"
            );
          }
          if (this.tailCow) {
            this.tailT += dt;
            var tailGate = Math.max(0, Math.sin(this.tailT * 0.42 + 1.7));
            tailGate = tailGate * tailGate;
            var tailSway =
              tailGate *
              (Math.sin(this.tailT * 1.38) * 18 +
                Math.sin(this.tailT * 2.17 + 1.1) * 7);
            this.tailCow.setAttribute("rotation", "0 " + tailSway + " 0");
          }
        }
      });

      AFRAME.registerComponent("grid-hover-scale", {
        schema: {
          amount: { type: "number", default: 1.13 },
          duration: { type: "number", default: 360 }
        },
        init: function () {
          this.current = 1;
          this.start = 1;
          this.target = 1;
          this.elapsed = this.data.duration;
          this.hitEl = this.el.querySelector(".grid-cell-hit");
          var onEnter = this.setHover.bind(this, true);
          var onLeave = this.setHover.bind(this, false);
          if (this.hitEl) {
            this.hitEl.addEventListener("mouseenter", onEnter);
            this.hitEl.addEventListener("mouseleave", onLeave);
          } else {
            this.el.addEventListener("mouseenter", onEnter);
            this.el.addEventListener("mouseleave", onLeave);
          }
        },
        setHover: function (hovered) {
          if (hovered && !SHOWCASE_POINTER_ACTIVE) return;
          this.start = this.current;
          this.target = hovered ? this.data.amount : 1;
          this.elapsed = 0;
        },
        bezierEase: function (t) {
          var inv = 1 - t;
          var y1 = 1;
          var y2 = 1;
          return 3 * inv * inv * t * y1 + 3 * inv * t * t * y2 + t * t * t;
        },
        tick: function (_, dt) {
          if (this.elapsed >= this.data.duration && this.current === this.target) return;
          this.elapsed = Math.min(this.data.duration, this.elapsed + (dt || 16));
          var p = this.elapsed / this.data.duration;
          var eased = this.bezierEase(p);
          this.current = this.start + (this.target - this.start) * eased;
          var s = this.current;
          this.el.setAttribute("scale", s + " " + s + " " + s);
        }
      });

      /* Four ropes: rim corners to exact points on the envelope ellipsoid (scaled sphere). */
      AFRAME.registerComponent("balloon-rig-ropes", {
        schema: {
          rimY: { type: "number", default: 0.48 },
          rimXZ: { type: "number", default: 0.31 },
          attachXZ: { type: "number", default: 0.352 },
          envelopeCy: { type: "number", default: 2.61 },
          radiusAx: { type: "number", default: 1.265 },

          el("a-cylinder", root, { position: "0 " + 0.44 * treeScale * tallMul + " 0", radius: String(0.072 * treeScale), height: String(0.88 * treeScale * tallMul), color: "#8B5A2B" });
          el("a-sphere", root, { position: "0 " + 1.07 * treeScale * tallMul + " 0", radius: String(0.4 * treeScale), scale: "1 1 1.22", color: "#2FA36A" });
        }

        function makeFlower(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("flower"),
            rotation: objectRotationStr("flower"),
            scale: objectScaleStr("flower", 1.88),
            "showcase-spin": showcaseSpinStr("flower")
          });
          var s = 1;
          el("a-cylinder", root, { position: "0 " + 0.12 * s + " 0", radius: String(0.024 * s), height: String(0.31 * s), color: "#2F8A3F" });
          for (var petalIndex = 0; petalIndex < 6; petalIndex++) {
            var angle = (petalIndex / 6) * Math.PI * 2;
            var px = Math.cos(angle) * 0.092 * s;
            var pz = Math.sin(angle) * 0.092 * s;
            el("a-sphere", root, { position: px + " " + 0.28 * s + " " + pz, radius: String(0.054 * s), scale: "1 0.52 0.95", color: "#FF7AD9", material: "shader: standard; roughness: 0.5; metalness: 0" });
          }
          el("a-sphere", root, { position: "0 " + 0.28 * s + " 0", radius: String(0.044 * s), color: "#FFD94D", material: "shader: standard; roughness: 0.45; metalness: 0" });
        }

        function makeSun(parent) {
          var spin = el("a-entity", parent, {
            position: objectPosition("sun"),
            rotation: objectRotationStr("sun"),
            "showcase-spin": showcaseSpinStr("sun")
          });
          var root = el("a-entity", spin, {
            scale: objectScaleStr("sun", 0.48)
          });
          el("a-sphere", root, {
            radius: "2.4",
            "segments-width": "64",
            "segments-height": "64",
            color: "#FFD45A",
            material: "shader: standard; roughness: 0.45; metalness: 0; emissive: #FFB000; emissiveIntensity: 1.2"
          });
          el("a-sphere", root, {
            radius: "3.05",
            "segments-width": "48",
            "segments-height": "48",
            color: "#FFE08A",
            material: "shader: flat; opacity: 0.22; transparent: true; side: double; depthWrite: false"
          });
          el("a-sphere", root, {
            radius: "3.8",
            "segments-width": "48",
            "segments-height": "48",
            color: "#FFF0B8",
            material: "shader: flat; opacity: 0.09; transparent: true; side: double; depthWrite: false"
          });
          el("a-entity", root, {
            light: "type: point; intensity: 0.55; distance: 14; decay: 1.2; color: #FFD45A"
          });
        }

        function appendNightFlameCluster(parent, px, py, pz, scale, delay, includeInner) {
          var cluster = el("a-entity", parent, {
            position: px + " " + py + " " + pz,
            scale: scale + " " + scale + " " + scale
          });
          el("a-cone", cluster, {
            position: "0 0.16 0",
            "radius-bottom": "0.12",
            "radius-top": "0.007",
            height: "0.4",
            color: "#FF5A12",
            material: "shader: standard; roughness: 0.22; metalness: 0; emissive: #FF3300; emissiveIntensity: 1.45",
            "animation__flicker":
              "property: scale; from: 0.92 0.95 0.9; to: 1.35 1.48 1.18; dir: alternate; dur: " +
              (330 + delay % 140) +
              "; delay: " +
              delay +
              "; easing: easeInOutSine; loop: true"
          });
          if (includeInner) {
            el("a-cone", cluster, {
              position: "0.012 0.19 -0.006",
              "radius-bottom": "0.06",
              "radius-top": "0.004",
              height: "0.29",
              color: "#FFE06A",
              material: "shader: standard; roughness: 0.14; metalness: 0; emissive: #FFC928; emissiveIntensity: 1.85",
              "animation__flicker":
                "property: scale; from: 1.12 0.9 1; to: 0.86 1.28 1.18; dir: alternate; dur: " +
                (260 + delay % 100) +
                "; delay: " +
                (delay + 80) +
                "; easing: easeInOutSine; loop: true"
            });
          }
          el("a-entity", cluster, {
            light: "type: point; intensity: 0.48; distance: 5.5; decay: 1.85; color: #FF6A18"
          });
          return cluster;
        }

        function appendShowcaseSmokePuff(parent, px, py, pz, scale, delay) {
          var smokeDur = 4200 + delay % 900;
          var endX = px + 0.2 * scale;
          var endY = py + 0.95 * scale;
          var endZ = pz + 0.09 * scale;
          return el("a-sphere", parent, {
            position: px + " " + py + " " + pz,
            radius: String(0.115 * scale),
            scale: "1.15 0.7 1.15",
            color: "#342F2C",
            material: "shader: standard; roughness: 1; metalness: 0; opacity: 0; transparent: true; depthWrite: false",
            "showcase-smoke-puff": "baseOpacity: 0.34; delay: " + delay + "; dur: " + smokeDur,
            "animation__rise":
              "property: position; from: " +
              px +
              " " +
              py +
              " " +
              pz +
              "; to: " +
              endX +
              " " +
              endY +
              " " +
              endZ +
              "; dur: " +
              smokeDur +
              "; delay: " +
              delay +
              "; easing: easeOutSine; loop: true",
            "animation__spread":
              "property: scale; from: 0.7 0.42 0.7; to: 3.0 1.65 3.0; dur: " +
              smokeDur +
              "; delay: " +
              delay +
              "; easing: easeOutSine; loop: true"
          });
        }

        function makeSign(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("sign"),
            rotation: objectRotationStr("sign"),
            scale: objectScaleStr("sign", 0.62),
            "showcase-spin": showcaseSpinStr("sign")
          });
          el("a-cylinder", root, {
            position: "-1 0.3 0",
            radius: "0.08",
            height: "1.6",
            color: "#B98956",
            material: "shader: standard; roughness: 0.78; metalness: 0"
          });
          el("a-cylinder", root, {
            position: "1 0.3 0",
            radius: "0.08",
            height: "1.6",
            color: "#B98956",
            material: "shader: standard; roughness: 0.78; metalness: 0"
          });
          el("a-box", root, {
            position: "0 1.45 0",
            width: "2.35",
            height: "0.9",
            depth: "0.08",
            color: "#F2F2F2",
            material: "shader: standard; roughness: 0.65; metalness: 0"
          });
        }

        function makeFlame(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("flame"),
            rotation: objectRotationStr("flame"),
            scale: objectScaleStr("flame", 1.35),
            "showcase-spin": showcaseSpinStr("flame")
          });
          appendNightFlameCluster(root, 0, 0, 0, 1, 0, false);
          appendShowcaseSmokePuff(root, -0.06, 0.38, 0.02, 0.55, 220);
          appendShowcaseSmokePuff(root, 0.08, 0.4, -0.02, 0.48, 780);
        }

        function makeFloatie(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("floatie"),
            rotation: objectRotationStr("floatie"),
            scale: objectScaleStr("floatie", 1.2),
            "showcase-spin": showcaseSpinStr("floatie")
          });
          el("a-entity", root, { geometry: "primitive: torus; radius: 0.352; radiusTubular: 0.054; segmentsRadial: 32; segmentsTubular: 96", material: "shader: standard; color: #FF7A1A; emissive: #662900; emissiveIntensity: 0.12; roughness: 0.48; metalness: 0.08", position: "0 0.036 0.018", rotation: "90 0 0" });
        }

        function makeChair(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("chair"),
            rotation: objectRotationStr("chair"),
            scale: objectScaleStr("chair", 1.45),
            "showcase-spin": showcaseSpinStr("chair")
          });
          var chair = el("a-entity", root, { position: "0 0.04 0" });
          var plastic = "#E8F3FF";
          var plasticMat =
            "shader: standard; roughness: 0.42; metalness: 0";
          el("a-box", chair, { position: "0 0.25 0", rotation: "0 0 0", width: "0.48", height: "0.065", depth: "0.46", color: plastic, material: plasticMat });
          el("a-box", chair, { position: "0 0.55 0.25", rotation: "0 0 0", width: "0.52", height: "0.52", depth: "0.07", color: plastic, material: plasticMat });
          el("a-box", chair, { position: "-0.34 0.39 0.02", rotation: "0 0 0", width: "0.07", height: "0.06", depth: "0.52", color: plastic, material: plasticMat });
          el("a-box", chair, { position: "0.34 0.39 0.02", rotation: "0 0 0", width: "0.07", height: "0.06", depth: "0.52", color: plastic, material: plasticMat });
          [
            [-0.18, 0.1, -0.18],
            [0.18, 0.1, -0.18],
            [-0.18, 0.1, 0.18],
            [0.18, 0.1, 0.18]
          ].forEach(function (p) {
            el("a-box", chair, { position: p.join(" "), rotation: "0 0 0", width: "0.052", height: "0.28", depth: "0.052", color: plastic, material: plasticMat });
          });
        }

        function makeUmbrella(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("umbrella"),
            rotation: objectRotationStr("umbrella"),
            scale: objectScaleStr("umbrella", 1.32)
          });
          var poleMat = "shader: standard; roughness: 0.42; metalness: 0.35";
          el("a-cylinder", root, { position: "0 0.91 0", radius: "0.035", height: "1.86", color: "#D7DCE2", material: poleMat });
          el("a-cylinder", root, { position: "0 -0.025 0", radius: "0.044", height: "0.16", color: "#B7BCC2", material: poleMat });
          var canopy = el("a-entity", root, {
            position: "0 1.5 0",
            animation__spin: "property: rotation; from: 0 0 0; to: 0 360 0; dur: 9000; easing: linear; loop: true"
          });
          var colors = ["#FF4F79", "#FFD447", "#31C7F5", "#FFFFFF"];
          var panels = 16;
          var radius = 0.78;
          for (var ui = 0; ui < panels; ui++) {
            var a0 = (ui / panels) * Math.PI * 2;
            var a1 = ((ui + 1) / panels) * Math.PI * 2;
            var p0x = Math.cos(a0) * radius;
            var p0z = Math.sin(a0) * radius;
            var p1x = Math.cos(a1) * radius;
            var p1z = Math.sin(a1) * radius;
            el("a-entity", canopy, {
              geometry:
                "primitive: triangle; vertexA: 0 0.34 0; vertexB: " +
                p0x +
                " 0 " +
                p0z +
                "; vertexC: " +
                p1x +
                " 0 " +
                p1z,
              material:
                "shader: standard; color: " +
                colors[ui % colors.length] +
                "; roughness: 0.38; metalness: 0; side: double"
            });
          }
          el("a-cylinder", canopy, { position: "0 0.31 0", radius: "0.07", height: "0.07", color: "#FFFFFF" });
        }

        function makeFishingRod(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("fishingRod"),
            rotation: objectRotationStr("fishingRod"),
            scale: objectScaleStr("fishingRod", 1.18),
            "showcase-spin": showcaseSpinStr("fishingRod")
          });
          var model = el("a-entity", root, { position: "-0.61 -0.42 0.96" });

          function cylinderBetween(from, to, radius, color, material) {
            var a = new THREE.Vector3(from[0], from[1], from[2]);
            var b = new THREE.Vector3(to[0], to[1], to[2]);
            var mid = a.clone().add(b).multiplyScalar(0.5);
            var dir = b.clone().sub(a);
            var len = dir.length();
            if (len < 1e-6) return;
            dir.normalize();
            var c = el("a-cylinder", model, {
              position: mid.x + " " + mid.y + " " + mid.z,
              radius: String(radius),
              height: String(len),
              color: color,
              material: material
            });
            c.object3D.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
          }

          cylinderBetween([0.465, 0.422, -0.445], [0.75, 1.02, -1.34], 0.014, "#5B3A23", "shader: standard; roughness: 0.7; metalness: 0.08");
          cylinderBetween([0.75, 1.02, -1.34], [0.6, 0.015, -1.48], 0.005, "#FFFFFF", "shader: standard; roughness: 0.38; metalness: 0.02; opacity: 0.86; transparent: true");
        }

        function makeBeachBall(parent) {
          var root = el("a-entity", parent, {
            position: objectPosition("beachBall"),
            rotation: objectRotationStr("beachBall"),
            scale: objectScaleStr("beachBall", 1.55),
            "showcase-spin": showcaseSpinStr("beachBall"),
            "showcase-beach-ball": ""
          });
        }

        var makers = [
          ["character", makeHuman, 1.25]
        ];

        function playSubtreeAnimations(node) {
          if (!node || !node.components) return;
          Object.keys(node.components).forEach(function (name) {
            if (name.indexOf("animation__") === 0) {
              var anim = node.components[name];
              if (anim && typeof anim.play === "function") anim.play();
            }
          });
          var ch = node.children;
          var i;
          for (i = 0; i < ch.length; i++) playSubtreeAnimations(ch[i]);
        }

        function buildShowcaseCells() {
          while (grid.firstChild) {
            grid.removeChild(grid.firstChild);
          }
          cells.length = 0;
          makers.forEach(function (item) {
            var key = item[0];
            var c = cell(key, item[2]);
            item[1](c);
          });
          playSubtreeAnimations(grid);
        }

        function initShowcase() {
          buildShowcaseCells();
          layoutGrid();
          forceSceneAspect();
        }

        function updateScrollPosition() {
          grid.setAttribute("position", "0 0 -1");
        }

        function forceSceneAspect() {
          if (!scene || !scene.renderer || !scene.camera) return;
          scene.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          scene.renderer.setSize(window.innerWidth, window.innerHeight, true);
          scene.camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
          scene.camera.updateProjectionMatrix();
        }

        function layoutGrid() {
          var fit = Math.min(window.innerWidth / 1200, window.innerHeight / 820);
          var gridScale = Math.max(1.08, Math.min(1.72, fit * 1.42));
          grid.setAttribute("scale", gridScale + " " + gridScale + " " + gridScale);

          cells.forEach(function (c) {
            c.setAttribute("position", "0 0 0");
          });

          spacer.style.height = window.innerHeight + "px";

          if (cameraEl && cfg.camera) {
            cameraEl.setAttribute("position", cfg.camera.position);
          }
          forceSceneAspect();
          updateScrollPosition();
        }

        function handleResize() {
          layoutGrid();
          forceSceneAspect();
        }

        window.addEventListener("resize", handleResize);
        scene.addEventListener("wheel", function (event) {
          event.preventDefault();
        }, { passive: false });
        cameraEl = document.querySelector("[camera]");
        if (scene.hasLoaded) initShowcase();
        else scene.addEventListener("loaded", initShowcase);
        scene.addEventListener("render-target-loaded", forceSceneAspect);
      });
    </script>
  </head>
  <body>
    <a-scene
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="alpha: true; antialias: true; precision: high; colorManagement: true"
      background="transparent: true">

      <a-entity light="type: ambient; intensity: 0.66"></a-entity>
      <a-entity light="type: directional; intensity: 1.05" position="3 7 6"></a-entity>
      <a-entity light="type: directional; intensity: 0.44" position="-5 2.5 4"></a-entity>

      <a-entity id="directoryGrid" position="0 0 -1" scale="1 1 1"></a-entity>

      <a-camera
        camera
        position="0 0.88 3.45"
        rotation="0 0 0"
        look-controls="enabled: false"
        wasd-controls="enabled: false"
        near="0.05"
        far="100">
      </a-camera>
    </a-scene>
    <div id="scrollSpacer" aria-hidden="true"></div>
    <script>
      (function () {
        function blockGesture(event) {
          if (event.cancelable) event.preventDefault();
        }
        document.addEventListener("gesturestart", blockGesture, { passive: false });
        document.addEventListener("gesturechange", blockGesture, { passive: false });
        document.addEventListener("gestureend", blockGesture, { passive: false });
        document.addEventListener("touchmove", function (event) {
          if (event.touches && event.touches.length > 1) blockGesture(event);
        }, { passive: false });
      })();
    </script>
  </body>
</html>
